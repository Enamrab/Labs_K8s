apiVersion: v1
kind: PersistentVolume
metadata:
  name: sql-pv
spec:
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: "5Gi"
  volumeMode: Filesystem
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: "/mnt/data/mysql"


---

apiVersion: v1
kind: PersistentVolumeClaim
metadata: 
  name: sql-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: "1Gi"
  storageClassName: manual
  volumeMode: Filesystem
  

