apiVersion: v1
kind: PersistentVolume
metadata:
  name: my-pv
spec:
  capacity:
    storage: "1Gi"
  volumeMode: Filesystem
  storageClassName: manual
  persistentVolumeReclaimPolicy: Retain
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /home/laborant/data
    type: DirectoryOrCreate
 
---
apiVersion: v1                                                                   
kind: PersistentVolumeClaim                                                           
metadata:                                                                        
  name: my-pvc                                                                   
spec:
  storageClassName: manual
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  resources:
    requests:
      storage: "1Gi"

